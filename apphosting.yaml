# Firebase App Hosting configuration
# Updated to match the actual secret names in Secret Manager
# Environment: enna

runConfig:
  minInstances: 0
  maxInstances: 10
  memoryR_MiB: 512

env:
  # Secrets from Google Cloud Secret Manager
  - variable: GEMINI_API_KEY
    secret: GOOGLE_GENAI_API_KEY
    availability:
      - BUILD
      - RUNTIME
  
  - variable: GOOGLE_APPLICATION_CREDENTIALS_JSON
    secret: GOOGLE_APPLICATION_CREDENTIALS_JSON
    availability:
      - BUILD
      - RUNTIME

